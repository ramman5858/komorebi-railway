<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173f35"><title>こもれび鉄道</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="game">
 <header><a class="brand" href="./"><span class="mark">▥</span><span>こもれび鉄道<small>KOMOREBI RAILWAY</small></span></a><div class="wallet"><span>運営資金</span><strong>◉ <b id="coins">0</b></strong></div></header>
 <section class="intro"><div><p class="eyebrow">小さな列車と、育っていく街。</p><h1>次の駅へ、夢をのせて。</h1></div><button id="pause" class="quiet" aria-label="運行を一時停止">Ⅱ 一時停止</button></section>
 <section class="world" aria-label="鉄道の運行マップ"><canvas id="map"></canvas><div class="map-tag"><span class="live-dot"></span><span id="route-label">こもれび線 / 2駅</span></div><div class="journey"><span id="status">はじまり駅で乗車中</span><strong id="passengers">0 / 6人</strong><div class="progress"><i id="progress"></i></div></div><button id="boost">➜ 押している間走る <small>指を離すとストップ</small></button></section>
 <section class="dashboard"><div class="operations"><div class="section-title"><h2>列車を育てよう</h2><span>TRAIN UPGRADES</span></div><div class="upgrade-grid"><button id="speed" class="upgrade"><span class="upgrade-icon">↗</span><span class="upgrade-copy"><strong>スピード</strong><small id="speed-level">レベル 1</small></span><span class="price" id="speed-price">◉ 40</span></button><button id="capacity" class="upgrade"><span class="upgrade-icon">▥</span><span class="upgrade-copy"><strong>車両を増やす</strong><small id="capacity-level">定員 6人</small></span><span class="price" id="capacity-price">◉ 60</span></button></div><div class="section-title expansion-title"><h2>街とつながろう</h2><span>EXPLORE THE LINE</span></div><button id="expand" class="expand"><span class="station-icon">⌂</span><span><strong id="expand-name">湖畔駅を開放</strong><small id="expand-description">湖のそばの街へ。運賃もアップ！</small></span><span class="price" id="expand-price">◉ 120</span></button></div><aside><p class="eyebrow">TODAY'S JOURNEY</p><h2>ゆっくり、街をつなぐ。</h2><p class="hint">押し続けると駅も通過します。<br>駅の近くで指を離すと停車して、<br>乗客が乗り降りします。</p><div class="stats"><div><strong id="delivered">0</strong><span>届けた乗客</span></div><div><strong id="stations">2</strong><span>つながった駅</span></div></div><p class="saved" id="saved">進行状況はこのブラウザに自動保存</p></aside></section>
 <footer><span>こもれび鉄道 · ブラウザ試作版</span><button id="reset">はじめから遊ぶ</button></footer>
</main><div id="toast" role="status" aria-live="polite"></div><script src="game.js"></script>
</body></html>
